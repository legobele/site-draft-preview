    <script>
      // Applies the stored theme before first paint (same key as the toggle).
      (function () {
        try {
          var dark = localStorage.getItem("boardui:theme") === "dark";
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.remove("dark");
        }
      })();
